services:
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${RUNTIME_DB_USER:-quotehub_app}:${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-quotehub}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      QUOTEHUB_ENV: ${QUOTEHUB_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-20 per minute}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-10 per hour}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quotehub}
      POSTGRES_USER: ${POSTGRES_USER:-quotehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db-roles:
    build: .
    profiles: [setup]
    command: ["python", "scripts/provision_db_roles.py"]
    environment:
      DB_ADMIN_USER: ${POSTGRES_USER:-quotehub}
      DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quotehub}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:-quotehub_app}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-quotehub_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build: .
    profiles: [setup]
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${MIGRATION_DB_USER:-quotehub_migrator}:${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB:-quotehub}
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    profiles: [ops]
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${MIGRATION_DB_USER:-quotehub_migrator}
      PGPASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-quotehub}
    volumes:
      - ./scripts:/scripts:ro
      - ${QUOTEHUB_BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  restore:
    image: postgres:17-alpine
    profiles: [ops]
    entrypoint: ["/bin/sh", "/scripts/restore.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-quotehub}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      QUOTEHUB_SOURCE_DB: ${POSTGRES_DB:-quotehub}
      QUOTEHUB_RESTORE_DB: ${QUOTEHUB_RESTORE_DB:-}
      QUOTEHUB_RESTORE_FILE: ${QUOTEHUB_RESTORE_FILE:-}
    volumes:
      - ./scripts:/scripts:ro
      - ${QUOTEHUB_BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
